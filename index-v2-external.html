<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オドメーターログ</title>
<style>
:root{--bg:#f4f1e9;--card:#fffdf8;--ink:#252525;--muted:#777;--line:#ddd6c9;--accent:#b47b2b;--danger:#b54b45;--soft:#eee8dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.page{max-width:680px;margin:auto;padding:18px 14px 56px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.version{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.vehicles{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.vehicle{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600}.vehicle.active{border-color:var(--accent);background:#f5ead7}.vehicle img{width:34px!important;height:18px!important;max-width:34px;max-height:18px;object-fit:contain;display:block}.hero .label{display:flex;align-items:center;justify-content:center;gap:7px}.hero .label img{width:150px!important;height:90px!important;max-width:100%;max-height:90px;object-fit:contain;display:inline-block}.manage-row img{width:38px!important;height:20px!important;max-width:38px;max-height:20px;object-fit:contain;display:block}.hero{text-align:center;padding:20px}.hero .label{font-size:13px;color:var(--muted)}.odo{font-size:42px;font-weight:800;letter-spacing:2px;margin:10px 0}.odo small{font-size:16px;color:var(--muted)}.date{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tab{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-weight:700}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin-top:11px}input,textarea,select{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit}textarea{min-height:72px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.unit{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:var(--soft)}.danger{color:var(--danger)}
.list-item{border-top:1px solid var(--line);padding:12px 0}.list-item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px}.kind{font-size:12px;font-weight:800}.detail{font-size:14px;margin-top:4px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.mini-actions{display:flex;gap:6px;margin-top:7px}.mini-actions button{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:5px 8px}.manage-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0}.manage-row:first-child{border-top:0}.manage-row img{width:38px;height:20px;object-fit:contain}.manage-row .name{flex:1}.notice{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none!important}.backup{display:flex;gap:8px}.backup button{flex:1}.status{font-size:12px;min-height:18px;margin-top:8px}.csv-help{margin-top:8px}.ok{color:#32764e}.err{color:var(--danger)}
@media(max-width:420px){.grid{grid-template-columns:1fr}.odo{font-size:36px}}
</style>
</head>
<body><main class="page">
<div class="top"><h1>オドメーターログ</h1><span class="version">Ver.2 / 2026-10-01</span></div>
<section class="card"><div id="vehicles" class="vehicles"></div><div class="actions"><button class="btn secondary" id="manageBtn">車両を管理</button><button class="btn secondary" id="addVehicleBtn">＋車両を追加</button></div><div id="manage" class="hidden"></div></section>
<section class="card hero"><div class="label" id="heroLabel"></div><div class="odo" id="heroOdo">— <small>km</small></div><div class="date" id="heroDate"></div></section>
<section class="card"><div class="tabs"><button class="tab active" data-tab="odo">オドメーター</button><button class="tab" data-tab="fuel">給油</button></div>
<div id="odoForm"><div class="grid"><label>記録日<input id="odoDate" type="date"></label><label>最終オドメーター<input id="odoValue" type="number" inputmode="decimal" min="0" step="1"></label></div><div class="unit hidden" id="odoDistance"></div><label>メモ（任意）<textarea id="odoMemo" placeholder="例：通勤、遠出など"></textarea></label><div class="actions"><button class="btn primary" id="saveOdo">記録する</button></div></div>
<div id="fuelForm" class="hidden"><div class="grid"><label>給油日<input id="fuelDate" type="date"></label><label>給油時オドメーター<input id="fuelOdo" type="number" inputmode="decimal" min="0" step="1" placeholder="例：25900"></label></div><div class="grid"><label>給油量（L）<input id="fuelLiters" type="number" inputmode="decimal" min="0" step="0.01"></label><label>支払金額（円）<input id="fuelPay" type="number" inputmode="numeric" min="0" step="1"></label></div><div class="unit" id="unitPrice">単価：—</div><label>メモ（任意）<textarea id="fuelMemo" placeholder="例：○○ガソリンスタンド"></textarea></label><div class="actions"><button class="btn primary" id="saveFuel">給油を記録</button></div></div>
</section>
<section class="card"><button type="button" id="recordToggle" class="btn secondary" style="width:100%;text-align:left"><span id="recordArrow">▸</span> 📋 記録一覧 <span id="recordCount"></span></button><div id="recordPanel" class="hidden" style="margin-top:8px"><div id="records"></div></div></section>
<section class="card"><h2 style="font-size:16px;margin:0 0 8px">バックアップ</h2><p class="notice">JSONで全車両の記録を保存・復元します。GitHubには保存されません。</p><div class="backup"><button class="btn primary" id="exportBtn">バックアップ保存</button><button class="btn secondary" id="importBtn">バックアップ読込</button><input id="file" type="file" accept="application/json,.json" class="hidden"></div><div class="actions"><button class="btn secondary danger" id="resetV2Btn">Ver.2を初期状態に戻す</button></div><div id="status" class="status"></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3 style="font-size:15px;margin:0 0 6px">CSV読み込み</h3><p class="notice">過去のCSVにも対応しています。「日付」「距離(km)」「給油量(L)」「支払額(円)」「メモ」などの列を読み込みます。給油日のCSVでは、給油行の距離を「給油時オドメーター」、同じ日の最後の距離を「その日の最終オドメーター」として別々に記録します。新しいCSVで「給油時オドメーター」列がある場合も対応します。</p><div class="backup"><button class="btn secondary" id="csvBtn">CSVを読み込む</button><input id="csvFile" type="file" accept=".csv,text/csv" class="hidden"></div><div id="csvStatus" class="status"></div></section>
</main>
<script>
(function(){'use strict';
const KEY='odometer-app-v2-final-data'; const ACTIVE='odometer-app-v2-final-active';
const ICONS={aqua:'aqua.svg',mrwagon:'mrwagon.svg',supercub:'supercub.svg'};
const DEFAULTS=[{id:'aqua',name:'トヨタアクア',type:'car',icon:'aqua',records:[]},{id:'mrwagon',name:'スズキMRワゴン',type:'car',icon:'mrwagon',records:[]},{id:'supercub110',name:'ホンダスーパーカブ110',type:'motorcycle',icon:'supercub',records:[]}];
const $=id=>document.getElementById(id); const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
let data=load(); let activeId=localStorage.getItem(ACTIVE)||data.vehicles[0].id; if(!data.vehicles.some(v=>v.id===activeId))activeId=data.vehicles[0].id; let tab='odo'; let editingId=null; let editingKind=null;
function uid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function load(){
  let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!x||!Array.isArray(x.vehicles))return {app:'odometer-app-v2',version:2,vehicles:DEFAULTS.map(v=>({...v,records:[]}))};
  // 旧Ver.2で作られた「その他」記録が残っている場合は、直前のオドメーターのメモへ移してから削除する。
  x.vehicles.forEach(v=>{
    const records=Array.isArray(v.records)?v.records:[];
    const others=records.filter(r=>r&&r.kind==='other');
    if(others.length){
      const odos=records.filter(r=>r&&r.kind==='odo').slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
      others.forEach(o=>{
        let target=null;for(const r of odos){if(r.date<=o.date)target=r;else break}
        if(target){const note='['+fmtDate(o.date)+'] '+String(o.content||'').trim()+(o.memo?'：'+String(o.memo).trim():'');target.memo=target.memo?(target.memo+' / '+note):note}
      });
      v.records=records.filter(r=>r&&r.kind!=='other');
    }
  });
  return x;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(ACTIVE,activeId)}
function vehicle(){return data.vehicles.find(v=>v.id===activeId)||data.vehicles[0]}
function icon(v){return '<img src="'+(ICONS[v.icon]||v.icon)+'" alt="">'}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){renderVehicles();renderHero();renderRecords();renderManage()}
function renderVehicles(){ $('vehicles').innerHTML='';data.vehicles.forEach(v=>{const b=document.createElement('button');b.className='vehicle'+(v.id===activeId?' active':'');b.innerHTML=icon(v)+esc(v.name);b.onclick=()=>{activeId=v.id;save();render()};$('vehicles').appendChild(b)})}
function renderHero(){const v=vehicle();$('heroLabel').innerHTML=icon(v)+' '+esc(v.name);const odos=v.records.filter(r=>r.kind==='odo').sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);const r=odos[odos.length-1];$('heroOdo').innerHTML=r?Number(r.odo).toLocaleString()+' <small>km</small>':'— <small>km</small>';$('heroDate').textContent=r?'記録日：'+fmtDate(r.date):'まだオドメーター記録がありません'}
function odoList(v){return v.records.filter(r=>r.kind==='odo'&&Number.isFinite(Number(r.odo))).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0))}
function previousOdo(v,date,createdAt,excludeId){const rs=odoList(v);let prev=null;for(const r of rs){if(excludeId&&r.id===excludeId)continue;const before=r.date<date||(r.date===date&&(createdAt==null||(r.createdAt||0)<createdAt));if(before)prev=r;else if(r.date>date)break}return prev}
function odoDistance(v,r){const p=previousOdo(v,r.date,r.createdAt,r.id);return p?Number(r.odo)-Number(p.odo):null}
function updateOdoDistance(){const v=vehicle();const date=$('odoDate').value;const odo=Number($('odoValue').value);if(!date||!Number.isFinite(odo)){$('odoDistance').textContent='';$('odoDistance').classList.add('hidden');return}const p=previousOdo(v,date,editingId?Date.now():Infinity,editingId);if(!p){$('odoDistance').textContent='';$('odoDistance').classList.add('hidden');return}const d=odo-Number(p.odo);if(!Number.isFinite(d)||d<0){$('odoDistance').textContent='本日の走行距離：—';$('odoDistance').classList.remove('hidden');return}$('odoDistance').textContent='本日の走行距離：'+d.toLocaleString()+' km';$('odoDistance').classList.remove('hidden')}
function renderRecords(){const v=vehicle();const rs=v.records.filter(r=>r.kind==='odo'||r.kind==='fuel').slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));$('recordCount').textContent=rs.length?'（'+rs.length+'件）':'';$('records').innerHTML=rs.length?rs.map(r=>{let detail='',sub='';if(r.kind==='odo'){const d=odoDistance(v,r);detail='オドメーター：'+Number(r.odo).toLocaleString()+' km'+(d!==null?'<br>本日の走行距離：'+d.toLocaleString()+' km':'');sub=r.memo?esc(r.memo):''}else{const fo=Number(r.fuelOdo),li=Number(r.liters),pa=Number(r.pay);detail='給油時オドメーター：'+(Number.isFinite(fo)?fo.toLocaleString():'—')+' km<br>給油量：'+(Number.isFinite(li)?li+' L':'—')+' / 支払：'+(Number.isFinite(pa)?pa.toLocaleString()+'円':'—');sub=Number.isFinite(li)&&li>0&&Number.isFinite(pa)?'単価：'+Math.round(pa/li).toLocaleString()+'円/L'+(r.memo?' ・ '+esc(r.memo):''):(r.memo?esc(r.memo):'')}return '<div class="list-item"><div class="row"><div><div class="kind">'+(r.kind==='odo'?'オドメーター':'給油')+'</div><div class="detail">'+detail+'</div><div class="sub">'+fmtDate(r.date)+(sub?' ・ '+sub:'')+'</div></div><div class="mini-actions"><button onclick="editRecord(\''+r.id+'\')">編集</button><button class="danger" onclick="deleteRecord(\''+r.id+'\')">削除</button></div></div></div>'}).join(''):'<p class="notice">この車両にはまだ記録がありません。</p>'}
function renderManage(){if($('manage').classList.contains('hidden'))return;$('manage').innerHTML=data.vehicles.map(v=>'<div class="manage-row">'+icon(v)+'<div class="name">'+esc(v.name)+'</div><button class="btn secondary" style="flex:0 0 auto;padding:6px 9px" onclick="renameVehicle(\''+v.id+'\')">名前変更</button><button class="btn secondary danger" style="flex:0 0 auto;padding:6px 9px" onclick="removeVehicle(\''+v.id+'\')">削除</button></div>').join('')+'<p class="notice">画像は車両IDに直接紐付いています。車両名を変更しても画像は変わりません。</p>'}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['odo','fuel'].forEach(x=>$(x+'Form').classList.toggle('hidden',x!==t))}
let recordOpen=false;
$('recordToggle').onclick=()=>{recordOpen=!recordOpen;$('recordPanel').classList.toggle('hidden',!recordOpen);$('recordArrow').textContent=recordOpen?'▾':'▸'};
function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=false}else cell+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c==='\r'){}else cell+=c}}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
function csvDate(v){v=String(v||'').trim();if(/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(v)){let a=v.split(/[-\/]/);return a[0]+'-'+String(a[1]).padStart(2,'0')+'-'+String(a[2]).padStart(2,'0')}if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)){let a=v.split('/');return a[2]+'-'+String(a[0]).padStart(2,'0')+'-'+String(a[1]).padStart(2,'0')}return ''}
function csvCol(h,names){for(let i=0;i<h.length;i++){let x=String(h[i]).replace(/^\uFEFF/,'').trim().toLowerCase();if(names.some(n=>x.includes(n)))return i}return -1}
$('csvBtn').onclick=()=>{$('csvFile').value='';$('csvFile').click()};
$('csvFile').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(rd.result);
      if(rows.length<2)throw new Error('empty');
      const h=rows[0];
      const di=csvCol(h,['日付','date']);
      const oi=csvCol(h,['オドメーター','odometer','距離(km)','距離','km']);
      const foi=csvCol(h,['給油時オドメーター','給油時ODO','fuelOdo']);
      const li=csvCol(h,['給油量','liter','liters']);
      const pi=csvCol(h,['支払額','金額','payment']);
      const pricei=csvCol(h,['単価','price']);
      const ni=csvCol(h,['メモ','備考','note']);
      if(di<0||oi<0)throw new Error('columns');

      const byDate=new Map();
      let invalid=0,missingOdoRows=[];
      for(let i=1;i<rows.length;i++){
        const row=rows[i];
        if(!row||row.every(x=>!String(x).trim()))continue;
        const date=csvDate(row[di]);
        const rawOdo=String(row[oi]??'').trim();
        const odo=parseFloat(rawOdo.replace(/,/g,''));
        const liters=li>=0?parseFloat(String(row[li]??'').replace(/,/g,'')):0;
        const pay=pi>=0?parseFloat(String(row[pi]??'').replace(/,/g,'')):0;
        const price=pricei>=0?parseFloat(String(row[pricei]??'').replace(/,/g,'')):0;
        const memo=ni>=0?String(row[ni]??'').trim():'';
        let fuelOdo=foi>=0?parseFloat(String(row[foi]??'').replace(/,/g,'')):NaN;
        if(!Number.isFinite(fuelOdo))fuelOdo=NaN;
        if(!date){invalid++;continue}
        const item={date,odo:Number.isFinite(odo)?odo:NaN,liters:Number.isFinite(liters)?liters:0,pay:Number.isFinite(pay)?pay:0,price:Number.isFinite(price)?price:0,memo,fuelOdo,order:i};
        if(!Number.isFinite(odo))missingOdoRows.push(item);
        if(!byDate.has(date))byDate.set(date,[]);
        byDate.get(date).push(item);
      }

      let incoming=[];
      byDate.forEach(items=>{
        items.sort((a,b)=>a.order-b.order);
        const fuelRows=items.filter(x=>x.liters>0&&Number.isFinite(x.odo));
        const odoRows=items.filter(x=>Number.isFinite(x.odo));
        if(fuelRows.length){
          fuelRows.forEach(x=>{
            const fuelOdo=Number.isFinite(x.fuelOdo)?x.fuelOdo:x.odo;
            incoming.push({kind:'fuel',date:x.date,fuelOdo,liters:x.liters,pay:x.pay,memo:x.memo});
          });
          const finalRow=odoRows[odoRows.length-1];
          if(odoRows.length>=2&&finalRow){
            incoming.push({kind:'odo',date:finalRow.date,odo:finalRow.odo,memo:finalRow.memo});
          }
        }else{
          odoRows.forEach(x=>incoming.push({kind:'odo',date:x.date,odo:x.odo,memo:x.memo}));
        }
      });

      // オドメーターが空の行は、直前にあるオドメーター記録のメモへ移す。
      // これで「洗車」などの補足行を別の「その他」記録にせず残せる。
      const pending=missingOdoRows.slice().sort((a,b)=>a.order-b.order);
      pending.forEach(x=>{
        const prev=incoming.slice().reverse().find(r=>r.kind==='odo'&&r.date<=x.date);
        if(prev&&x.memo){prev.memo=prev.memo?(prev.memo+' / '+x.memo):x.memo}
      });

      if(!incoming.length)throw new Error('no_records');
      const target=vehicle();
      let added=0;
      const keys=new Set(target.records.map(r=>r.kind+'|'+r.date+'|'+(r.odo??'')+'|'+(r.fuelOdo??'')+'|'+(r.liters??'')+'|'+(r.pay??'')+'|'+(r.memo||'')));
      incoming.forEach(r=>{
        const k=r.kind+'|'+r.date+'|'+(r.odo??'')+'|'+(r.fuelOdo??'')+'|'+(r.liters??'')+'|'+(r.pay??'')+'|'+(r.memo||'');
        if(!keys.has(k)){keys.add(k);target.records.push({id:uid(),createdAt:Date.now()+added,...r});added++}
      });
      save();render();$('recordPanel').classList.remove('hidden');recordOpen=true;$('recordArrow').textContent='▾';
      $('csvStatus').textContent=added+'件を「'+target.name+'」に読み込みました。'+(incoming.length-added?'（重複 '+(incoming.length-added)+'件を除外）':'')+(invalid?'。日付を読めない行 '+invalid+'件を除外':'')+(missingOdoRows.length?'。オドメーター空欄 '+missingOdoRows.length+'行は直前のオドメーターのメモへ反映':'');
      $('csvStatus').className='status ok';
    }catch(err){
      $('csvStatus').textContent=err.message==='columns'?'「日付」と「距離（またはオドメーター）」の列が見つかりません。':'CSVを読み込めませんでした。CSVの列名や内容を確認してください。';
      $('csvStatus').className='status err';
    }
  };
  rd.readAsText(f,'UTF-8')
};
function resetForms(){['odoDate','fuelDate'].forEach(id=>$(id).value=today());['odoValue','odoMemo','fuelOdo','fuelLiters','fuelPay','fuelMemo'].forEach(id=>$(id).value='');$('unitPrice').textContent='単価：—';editingId=null;editingKind=null;setSaveButtons();updateOdoDistance()}
function setSaveButtons(){
  $('saveOdo').textContent=editingKind==='odo'?'編集内容を保存':'記録する';
  $('saveFuel').textContent=editingKind==='fuel'?'編集内容を保存':'給油を記録';
}
function addRecord(r){vehicle().records.push({id:uid(),createdAt:Date.now(),...r});save();resetForms();render()}
function saveForm(kind){
  const v=vehicle();
  if(kind==='odo'){
    const date=$('odoDate').value,odo=Number($('odoValue').value);
    if(!date||!Number.isFinite(odo))return alert('記録日とオドメーターを入力してください。');
    const memo=$('odoMemo').value.trim();
    if(editingId&&editingKind==='odo'){const r=v.records.find(x=>x.id===editingId);if(r){r.date=date;r.odo=odo;r.memo=memo;save();resetForms();render()}}else addRecord({kind:'odo',date,odo,memo});
  }else if(kind==='fuel'){
    const date=$('fuelDate').value;
    const fuelOdoRaw=$('fuelOdo').value.trim(), litersRaw=$('fuelLiters').value.trim(), payRaw=$('fuelPay').value.trim();
    const fuelOdo=fuelOdoRaw===''?null:Number(fuelOdoRaw), liters=litersRaw===''?null:Number(litersRaw), pay=payRaw===''?null:Number(payRaw);
    if(!date||[fuelOdo,liters,pay].every(x=>x===null))return alert('給油日と、給油時オドメーター・給油量・支払金額のいずれかを入力してください。');
    if((fuelOdo!==null&&!Number.isFinite(fuelOdo))||(liters!==null&&(!Number.isFinite(liters)||liters<0))||(pay!==null&&(!Number.isFinite(pay)||pay<0)))return alert('給油時オドメーター・給油量・支払金額の数値を確認してください。');
    const memo=$('fuelMemo').value.trim();
    if(editingId&&editingKind==='fuel'){const r=v.records.find(x=>x.id===editingId);if(r){r.date=date;r.fuelOdo=fuelOdo;r.liters=liters;r.pay=pay;r.memo=memo;save();resetForms();render()}}else addRecord({kind:'fuel',date,fuelOdo,liters,pay,memo});
  }
}
$('saveOdo').onclick=()=>saveForm('odo');
$('saveFuel').onclick=()=>saveForm('fuel');
$('odoDate').oninput=updateOdoDistance;
$('odoValue').oninput=updateOdoDistance;
$('fuelLiters').oninput=$('fuelPay').oninput=()=>{const l=Number($('fuelLiters').value),p=Number($('fuelPay').value);$('unitPrice').textContent=l>0&&p>=0?'単価：'+Math.round(p/l).toLocaleString()+'円/L':'単価：—'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;if(editingId&&editingKind!==t){if(!confirm('編集中の内容を破棄して別の記録へ移動しますか？'))return;resetForms()}setTab(t)});
$('manageBtn').onclick=()=>{$('manage').classList.toggle('hidden');renderManage()};
$('addVehicleBtn').onclick=()=>{const name=prompt('車両名を入力してください');if(!name)return;const id=uid();data.vehicles.push({id,name:name.trim(),type:'car',icon:'generic-car.svg',records:[]});activeId=id;save();render()};
window.renameVehicle=id=>{const v=data.vehicles.find(x=>x.id===id);if(!v)return;const n=prompt('車両名を入力してください',v.name);if(n&&n.trim()){v.name=n.trim();save();render()}};
window.removeVehicle=id=>{if(data.vehicles.length<=1)return alert('最後の1台は削除できません。');const v=data.vehicles.find(x=>x.id===id);if(v&&!confirm(v.name+'を削除しますか？記録も削除されます。'))return;data.vehicles=data.vehicles.filter(x=>x.id!==id);if(activeId===id)activeId=data.vehicles[0].id;save();render()};
window.deleteRecord=id=>{const v=vehicle(),r=v.records.find(x=>x.id===id);if(r&&confirm('この記録を削除しますか？')){v.records=v.records.filter(x=>x.id!==id);save();render()}};
window.editRecord=id=>{const v=vehicle(),r=v.records.find(x=>x.id===id);if(!r||!['odo','fuel'].includes(r.kind))return;editingId=r.id;editingKind=r.kind;setTab(r.kind);if(r.kind==='odo'){$('odoDate').value=r.date;$('odoValue').value=r.odo;$('odoMemo').value=r.memo||'';updateOdoDistance()}else{$('fuelDate').value=r.date;$('fuelOdo').value=Number.isFinite(Number(r.fuelOdo))?r.fuelOdo:'';$('fuelLiters').value=Number.isFinite(Number(r.liters))?r.liters:'';$('fuelPay').value=Number.isFinite(Number(r.pay))?r.pay:' ';$('fuelPay').value=$('fuelPay').value.trim();$('fuelMemo').value=r.memo||'';$('fuelLiters').oninput();$('fuelPay').oninput()}setSaveButtons();window.scrollTo({top:0,behavior:'smooth'})};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='odometer-v2-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);$('status').textContent='バックアップを保存しました。';$('status').className='status ok'};
$('resetV2Btn').onclick=()=>{if(!confirm('Ver.2のデータをすべて消去し、トヨタアクア・スズキMRワゴン・ホンダスーパーカブ110の3台だけの初期状態に戻します。\n\nVer.1のデータには影響しません。よろしいですか？'))return;localStorage.removeItem(KEY);localStorage.removeItem(ACTIVE);location.reload()};
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!Array.isArray(x.vehicles))throw 0;const ok=confirm('バックアップの車両と記録を読み込みます。現在のデータに追加します。よろしいですか？');if(!ok)return;let added=0;x.vehicles.forEach(iv=>{let target=data.vehicles.find(v=>v.name===iv.name);if(!target){target={id:uid(),name:iv.name||'マイカー',type:iv.type||'car',icon:iv.icon||'generic-car.svg',records:[]};data.vehicles.push(target)}(iv.records||iv.entries||[]).forEach(raw=>{let r=normalizeOld(raw);if(r&&r.kind!=='other'){target.records.push({...r,id:uid(),createdAt:Date.now()+added});added++}})});save();render();$('status').textContent=added+'件を追加しました。';$('status').className='status ok'}catch(err){$('status').textContent='このバックアップ形式は読み込めません。';$('status').className='status err'}};rd.readAsText(f)};
function normalizeOld(r){if(!r||!r.date)return null;if(r.kind)return r;if(typeof r.odo==='number'||Number.isFinite(Number(r.odo))){let note=String(r.note||'');let m=note.match(/([0-9]+(?:\.[0-9]+)?)L.*?([0-9,]+)円/);if(r.fuel||m){const fo=Number.isFinite(Number(r.fuelOdo))?Number(r.fuelOdo):Number(r.odo);return {kind:'fuel',date:r.date,fuelOdo:fo,liters:m?Number(m[1]):Number(r.liters||0),pay:m?Number(m[2].replace(/,/g,'')):Number(r.pay||0),memo:note.replace(/^[^/]*?([0-9]+(?:\.[0-9]+)?)L.*$/,'').trim()}}return {kind:'odo',date:r.date,odo:Number(r.odo),memo:note}}return null}
resetForms();render();
})();
</script></body></html>
